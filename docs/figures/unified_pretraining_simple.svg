<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="1600" viewBox="0 0 1800 800">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
  </marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17324A; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #587083; }
    .stage { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #60798C; }
    .head { font-size: 20px; font-weight: 700; }
    .card { font-size: 15px; font-weight: 700; }
    .body { font-size: 14px; fill: #52697B; }
    .small { font-size: 12px; fill: #52697B; }
    .tiny { font-size: 11px; fill: #52697B; }
    .chip { font-size: 12px; font-weight: 700; }
    .banner { font-size: 13px; font-weight: 700; letter-spacing: .6px; fill: #355269; }
    .line { fill: none; stroke: #7E93A5; stroke-width: 3; marker-end: url(#arrow); }
    .green { fill: none; stroke: #2E9165; stroke-width: 3; marker-end: url(#arrow); }
    .orange { fill: none; stroke: #D47A13; stroke-width: 3; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="1800" height="800" fill="white"/>

<text x="900" y="52" class="title" text-anchor="middle">Unified Glance-Focus pretraining and task adaptation</text>
<text x="900" y="84" class="subtitle" text-anchor="middle">Heterogeneous modalities share one representation; incompatible labels remain in separate task heads</text>

<text x="45" y="128" class="stage">1  PRETRAINING TASKS</text>
<line x1="45" y1="143" x2="430" y2="143" stroke="#CCD7DF" stroke-width="1.5"/>
<text x="490" y="128" class="stage">2  TASK SAMPLING</text>
<line x1="490" y1="143" x2="720" y2="143" stroke="#CCD7DF" stroke-width="1.5"/>
<text x="775" y="128" class="stage">3  SHARED BACKBONE</text>
<line x1="775" y1="143" x2="1265" y2="143" stroke="#CCD7DF" stroke-width="1.5"/>
<text x="1320" y="128" class="stage">4  TASK-SPECIFIC SUPERVISION</text>
<line x1="1320" y1="143" x2="1755" y2="143" stroke="#CCD7DF" stroke-width="1.5"/>

<!-- Grouped task inputs -->
<rect x="45" y="175" width="385" height="455" rx="19" fill="#F4F8FB" stroke="#668397" stroke-width="2.2"/>
<text x="237" y="214" class="head" text-anchor="middle">Eight original task schemas</text>

<rect x="72" y="245" width="331" height="82" rx="13" fill="#E9E5F6" stroke="#785AA6" stroke-width="1.7"/>
<!-- brain MRI symbol -->
<circle cx="112" cy="286" r="25" fill="#FFFFFF" stroke="#785AA6" stroke-width="5"/>
<path d="M101 277 C92 282 96 296 106 297 C110 307 126 304 126 293 C136 287 129 272 118 276 C114 270 105 271 101 277 Z" fill="#F4D8E8" stroke="#B65D87" stroke-width="2"/>
<text x="150" y="273" class="card">Brain MRI ± CT/RTP</text>
<text x="150" y="297" class="small">BrainMets · MU-Glioma · UCSD-PTGB · Glioma</text>
<text x="150" y="316" class="tiny">T1 variants · T2 variants · FLAIR · ADC · CT · RTP</text>

<rect x="72" y="344" width="331" height="70" rx="13" fill="#EEE7F7" stroke="#785AA6" stroke-width="1.7"/>
<circle cx="112" cy="379" r="24" fill="#FFFFFF" stroke="#785AA6" stroke-width="5"/>
<path d="M97 379 C104 365 127 365 132 379 C125 391 105 392 97 379 Z" fill="#D98D78" stroke="#A84F43" stroke-width="2"/>
<text x="150" y="372" class="card">Prostate MRI</text>
<text x="150" y="397" class="small">PI-CAI · T2W + ADC + HBV</text>

<rect x="72" y="431" width="331" height="70" rx="13" fill="#E7EEF3" stroke="#607F93" stroke-width="1.7"/>
<circle cx="112" cy="466" r="24" fill="#FFFFFF" stroke="#607F93" stroke-width="6"/>
<circle cx="112" cy="466" r="12" fill="#D8E6EF" stroke="#8DA6B7" stroke-width="2"/>
<text x="150" y="459" class="card">Chest CT</text>
<text x="150" y="484" class="small">LUNA25 · lung-nodule CT</text>

<rect x="72" y="518" width="331" height="82" rx="13" fill="#FFF0D9" stroke="#D47A13" stroke-width="1.7"/>
<circle cx="112" cy="559" r="24" fill="#FFFFFF" stroke="#607F93" stroke-width="6"/>
<circle cx="106" cy="554" r="6" fill="#F2B134"/><circle cx="119" cy="566" r="5" fill="#E65B45"/>
<text x="150" y="546" class="card">Whole-body PET/CT</text>
<text x="150" y="570" class="small">PETWB Lung · PETWB Liver</text>
<text x="150" y="590" class="tiny">paired CT + FDG PET</text>

<text x="237" y="621" class="tiny" text-anchor="middle">9,945 cases · 1-6 named channels per examination</text>

<!-- Sampling -->
<path d="M430 400 H490" class="line"/>
<rect x="490" y="245" width="230" height="310" rx="19" fill="#E6F2FB" stroke="#3E88BD" stroke-width="2.3"/>
<text x="605" y="288" class="head" text-anchor="middle">Sample one task</text>
<text x="605" y="324" class="body" text-anchor="middle">One dataset is selected</text>
<text x="605" y="349" class="body" text-anchor="middle">for each training step</text>

<rect x="525" y="382" width="160" height="50" rx="12" fill="#FFFFFF" stroke="#9ABDD5" stroke-width="1.5"/>
<text x="605" y="403" class="chip" text-anchor="middle">Task-homogeneous batch</text>
<text x="605" y="422" class="tiny" text-anchor="middle">images + valid labels</text>

<rect x="525" y="457" width="160" height="58" rx="12" fill="#CFE6F6" stroke="#3E88BD" stroke-width="1.5"/>
<text x="605" y="480" class="chip" text-anchor="middle">Known task key</text>
<text x="605" y="501" class="tiny" text-anchor="middle">modality IDs + head schema</text>

<!-- Shared backbone -->
<path d="M720 400 H775" class="line"/>
<rect x="775" y="175" width="490" height="455" rx="20" fill="#F7F3FA" stroke="#785AA6" stroke-width="2.5"/>
<text x="1020" y="214" class="head" text-anchor="middle">Shared modality-aware Glance-Focus</text>

<rect x="820" y="250" width="400" height="82" rx="14" fill="#F0EAF8" stroke="#785AA6" stroke-width="1.8"/>
<text x="1020" y="280" class="card" text-anchor="middle">Modality-set stem</text>
<text x="1020" y="306" class="small" text-anchor="middle">shared channel encoder + modality embedding + attention fusion</text>

<path d="M1020 332 V365 H915 V390" class="orange"/>
<path d="M1020 365 H1125 V390" class="green"/>

<rect x="820" y="390" width="190" height="135" rx="16" fill="#FFF0D9" stroke="#D47A13" stroke-width="2"/>
<text x="915" y="430" class="head" text-anchor="middle">GLANCE</text>
<text x="915" y="462" class="body" text-anchor="middle">whole-volume context</text>
<text x="915" y="491" class="small" text-anchor="middle">global feature</text>

<rect x="1030" y="390" width="190" height="135" rx="16" fill="#E5F4EC" stroke="#2E9165" stroke-width="2"/>
<text x="1125" y="430" class="head" text-anchor="middle">FOCUS</text>
<text x="1125" y="462" class="body" text-anchor="middle">local encoder-decoder</text>
<text x="1125" y="491" class="small" text-anchor="middle">mask + lesion feature</text>

<path d="M915 525 V555 H1020" class="orange"/>
<path d="M1125 525 V555 H1020" class="green"/>
<rect x="820" y="555" width="400" height="50" rx="12" fill="#E6F2FB" stroke="#3E88BD" stroke-width="1.6"/>
<text x="1020" y="577" class="chip" text-anchor="middle">Shared classification trunk + task embedding</text>
<text x="1020" y="596" class="tiny" text-anchor="middle">common features, task-conditioned interpretation</text>

<!-- Heads -->
<path d="M1265 400 H1320" class="line"/>
<rect x="1320" y="175" width="435" height="455" rx="20" fill="#F4F7F9" stroke="#668397" stroke-width="2.3"/>
<text x="1537" y="214" class="head" text-anchor="middle">Task-specific head bank</text>
<text x="1537" y="241" class="small" text-anchor="middle">The known task key activates one compatible head set</text>

<rect x="1355" y="272" width="365" height="77" rx="13" fill="#FFFFFF" stroke="#B7C7D2" stroke-width="1.5"/>
<text x="1537" y="300" class="card" text-anchor="middle">Brain tasks</text>
<text x="1537" y="324" class="small" text-anchor="middle">BrainMets · MU-Glioma · UCSD-PTGB · Glioma</text>
<text x="1537" y="342" class="tiny" text-anchor="middle">separate segmentation + clinical heads for each dataset</text>

<rect x="1355" y="368" width="174" height="77" rx="13" fill="#FFFFFF" stroke="#B7C7D2" stroke-width="1.5"/>
<text x="1442" y="397" class="card" text-anchor="middle">PI-CAI</text>
<text x="1442" y="422" class="small" text-anchor="middle">prostate/tumor + ISUP</text>
<rect x="1546" y="368" width="174" height="77" rx="13" fill="#FFFFFF" stroke="#B7C7D2" stroke-width="1.5"/>
<text x="1633" y="397" class="card" text-anchor="middle">LUNA25</text>
<text x="1633" y="422" class="small" text-anchor="middle">nodule + malignancy</text>

<rect x="1355" y="464" width="174" height="77" rx="13" fill="#FFFFFF" stroke="#B7C7D2" stroke-width="1.5"/>
<text x="1442" y="493" class="card" text-anchor="middle">PETWB Lung</text>
<text x="1442" y="518" class="small" text-anchor="middle">lung + cancer status</text>
<rect x="1546" y="464" width="174" height="77" rx="13" fill="#FFFFFF" stroke="#B7C7D2" stroke-width="1.5"/>
<text x="1633" y="493" class="card" text-anchor="middle">PETWB Liver</text>
<text x="1633" y="518" class="small" text-anchor="middle">liver + cancer status</text>

<rect x="1355" y="565" width="365" height="42" rx="12" fill="#DCECF7" stroke="#3E88BD" stroke-width="1.5"/>
<text x="1537" y="583" class="chip" text-anchor="middle">Only the selected heads enter the loss</text>
<text x="1537" y="600" class="tiny" text-anchor="middle">inactive heads produce no logits and receive no gradient</text>

<!-- Checkpoint and downstream transfer -->
<path d="M1020 630 V670" class="line"/>
<path d="M1537 630 V650 H1020" class="line"/>
<rect x="665" y="670" width="710" height="67" rx="17" fill="#DDECF6" stroke="#3E88BD" stroke-width="2"/>
<text x="1020" y="698" class="head" text-anchor="middle">Unified pretrained checkpoint</text>
<text x="1020" y="724" class="small" text-anchor="middle">shared representation learned from all eight tasks; label spaces remain separate</text>

<path d="M1375 703 H1425" class="green"/>
<rect x="1425" y="662" width="330" height="83" rx="16" fill="#E5F4EC" stroke="#2E9165" stroke-width="1.8"/>
<text x="1590" y="691" class="card" text-anchor="middle">Later adaptation</text>
<text x="1590" y="716" class="small" text-anchor="middle">add new EGCT or PHLF heads</text>
<text x="1590" y="736" class="tiny" text-anchor="middle">load shared weights, then fine-tune task-only</text>

<rect x="45" y="760" width="1710" height="38" rx="14" fill="#F2F5F7" stroke="#CBD7DF" stroke-width="1.5"/>
<text x="900" y="785" class="banner" text-anchor="middle">ONE SHARED BACKBONE  |  ONE TASK PER TRAINING STEP  |  ONE TASK-SPECIFIC HEAD SET ACTIVE  |  EGCT AND PHLF ARE LATER FINE-TUNING TASKS</text>
</svg>